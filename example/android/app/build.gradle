plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode") ?: "1"
def flutterVersionName = localProperties.getProperty("flutter.versionName") ?: "1.0"

android {
    namespace "br.com.jylabtech.msitef_payment_tech_example"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    signingConfigs {
        positivo {
            storeFile file("..\\..\\Chaves\\positivo-keystore.jks")
            keyAlias "platform"
            keyPassword "654321"
            storePassword "123456"
        }
    }

    lint {
        disable += "InvalidPackage"
    }

    defaultConfig {
        applicationId "br.com.jylabtech.msitef_payment_tech_example"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    buildTypes {
        release {
            shrinkResources false
            minifyEnabled false
            signingConfig signingConfigs.positivo
        }
        debug {
            shrinkResources false
            minifyEnabled false
            signingConfig signingConfigs.positivo
        }
    }

    packagingOptions {
        resources {
            excludes += [
                    "META-INF/api_release.kotlin_module",
                    "META-INF/client_release.kotlin_module"
            ]
        }
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }
}

flutter {
    source "../.."
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib"
}

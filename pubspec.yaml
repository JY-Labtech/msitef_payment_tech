name: msitef_payment_tech
description: Plugin Flutter para integrar sua aplicação com o SDK Android do MSitef para meios de pagamento.
version: 1.1.0
repository: https://github.com/JY-Labtech/msitef_payment_tech

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2
  check_licence_tech: ^0.1.0+1

dev_dependencies:
  json_serializable: ^6.7.1
  build_runner: ^2.4.9
  flutter_test:
    sdk: flutter
  flutter_lints: ^1.0.0

flutter:
  plugin:
    platforms:
      android:
        package: br.com.jylabtech.msitef_payment_tech
        pluginClass: MSitefPaymentTechPlugin

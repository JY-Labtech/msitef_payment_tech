group = "br.com.jylabtech.msitef_payment_tech"
version = "1.0"

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.9.1")
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"

def nativeJarFiles = fileTree(dir: "libs", include: ["*-native.jar"]).files
if (nativeJarFiles.isEmpty()) {
    throw new GradleException("Nenhum artefato nativo encontrado em android/libs. Execute scripts/build_android_aar.sh para gerar o AAR.")
}

android {
    namespace = "br.com.jylabtech.msitef_payment_tech"
    compileSdk = 36

    defaultConfig {
        minSdk = 23
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*-native.jar"])
    implementation "androidx.security:security-crypto:1.1.0-alpha05"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "com.google.code.gson:gson:2.10.1"
    implementation 'com.google.zxing:core:3.5.1'
    implementation('com.journeyapps:zxing-android-embedded:4.3.0') { transitive = false }
}
